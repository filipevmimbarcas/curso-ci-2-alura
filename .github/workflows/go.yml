name: Go

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.22']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}

    - name: Create-DB
      run: docker compose up -d

    - name: Aguardar Postgres
      run: timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'

    - name: Test
      run: go test -v main_test.go

    - name: Logs do Postgres
      if: failure()
      run: docker compose logs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v main.go

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
